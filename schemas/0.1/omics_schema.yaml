table_name: omics
version: "3.0"  # CLIF version whose conventions AERIE follows; clifpy stamps this on validation results
aerie_version: "0.1"

columns:
- name: patient_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: hospitalization_id
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: specimen_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: collect_dttm
  data_type: DATETIME
  required: true
  is_category_column: false
  is_group_column: false
- name: specimen_name
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: specimen_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - whole_blood
  - plasma
  - serum
  - hme
  - urine
  - hair
  - other
- name: study_name
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: irb_protocol_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: consent_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - broad_research
  - specific_use
  - opt_out
  - waiver_of_consent
  - withdrawn
  - other
- name: assay_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: sample_batch_name
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: assay_dttm
  data_type: DATETIME
  required: false
  is_category_column: false
  is_group_column: false
- name: assay_name
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: assay_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - ms_proteomics
  - sanger_sequencing
  - targeted_sequencing
  - long_read_sequencing
  - rna_seq_bulk
  - rna_seq_single_cell
  - microarray_expression
  - gwas_array
  - wes
  - wgs
  - methylation_epic
  - methylation_450k
  - lc_ms_metabolomics
  - gc_ms_metabolomics
  - nmr_metabolomics
  - '16s_amplicon'
  - shotgun_metagenomics
  - flow_cytometry
  - mass_cytometry
  - other
- name: assay_group
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: true
  permissible_values:
  - proteomics
  - transcriptomics
  - genomics
  - epigenomics
  - metabolomics
  - microbiomics
  - cytometry
  - other
- name: result_uri
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: result_specimen_key
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: result_format
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - csv
  - tsv
  - parquet
  - h5ad
  - h5
  - mtx
  - vcf
  - bcf
  - fastq
  - bam
  - cram
  - idat
  - mzml
  - na
  - other
- name: qc_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - pass
  - fail
  - flagged
  - na

required_columns:
  - patient_id
  - specimen_id
  - collect_dttm
  - specimen_category
  - study_name
  - irb_protocol_id
  - consent_category
  - assay_id
  - assay_category
  - assay_group
  - result_uri
  - result_format
  - qc_category

category_columns:
  - specimen_category
  - consent_category
  - assay_category
  - result_format
  - qc_category

group_columns:
  - assay_group

assay_category_to_group_mapping:
  ms_proteomics: proteomics
  sanger_sequencing: genomics
  targeted_sequencing: genomics
  long_read_sequencing: genomics
  rna_seq_bulk: transcriptomics
  rna_seq_single_cell: transcriptomics
  microarray_expression: transcriptomics
  gwas_array: genomics
  wes: genomics
  wgs: genomics
  methylation_epic: epigenomics
  methylation_450k: epigenomics
  lc_ms_metabolomics: metabolomics
  gc_ms_metabolomics: metabolomics
  nmr_metabolomics: metabolomics
  '16s_amplicon': microbiomics
  shotgun_metagenomics: microbiomics
  flow_cytometry: cytometry
  mass_cytometry: cytometry
  other: other
