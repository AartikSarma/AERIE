table_name: analyte_result
version: "3.0"  # CLIF version whose conventions AERIE follows; clifpy stamps this on validation results
aerie_version: "0.1"

columns:
- name: specimen_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: assay_run_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: sample_batch_name
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: analyte_name
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: analyte_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - ang1
  - ang2
  - ccl8
  - cotinine
  - cx3cl1
  - cxcl9
  - d_dimer
  - e_selectin
  - gdf15
  - gm_csf
  - hydroxycotinine
  - icam1
  - ifn_gamma
  - il1_beta
  - il1ra
  - il1r2
  - il4
  - il6
  - il8
  - il10
  - il13
  - il18
  - il27
  - ip10
  - mip1_alpha
  - mmp8
  - mmp9
  - nnal
  - nnal_free
  - olfm4
  - pai1
  - procalcitonin
  - protein_c
  - p_selectin
  - rage
  - sp_d
  - telomere_length
  - thrombomodulin
  - tnf_alpha
  - tnfr1
  - trem1
  - triglycerides
  - vegf
  - vwf
  - total_protein
  - creatinine
  - aama
  - cnema
  - hema
  - hpma_2
  - hpma_3
  - hpmma
  - mhbma_1_2
  - mhbma_3
  - pma
  - other
- name: result_value
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: result_value_numeric
  data_type: DOUBLE
  required: false
  is_category_column: false
  is_group_column: false
- name: result_unit
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: qc_name
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: qc_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - pass
  - fail
  - flagged
  - na

required_columns:
  - specimen_id
  - assay_run_id
  - analyte_name
  - analyte_category
  - result_value
  - qc_category

category_columns:
  - analyte_category
  - qc_category

group_columns: []
