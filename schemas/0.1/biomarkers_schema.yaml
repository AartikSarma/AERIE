table_name: biomarkers
version: "3.0"  # CLIF version whose conventions AERIE follows; clifpy stamps this on validation results
aerie_version: "0.1"

columns:
- name: patient_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: hospitalization_id
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: specimen_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: collect_dttm
  data_type: DATETIME
  required: true
  is_category_column: false
  is_group_column: false
- name: specimen_name
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: specimen_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - whole_blood
  - plasma
  - serum
  - pbmc
  - urine
  - csf
  - bal
  - tracheal_aspirate
  - sputum
  - stool
  - saliva
  - tissue
  - nasal_swab
  - other
- name: study_name
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: irb_protocol_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: consent_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - broad_research
  - specific_use
  - opt_out
  - waiver_of_consent
  - withdrawn
  - other
- name: assay_id
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: sample_batch_name
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: assay_dttm
  data_type: DATETIME
  required: false
  is_category_column: false
  is_group_column: false
- name: assay_name
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: assay_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - elisa
  - luminex
  - olink
  - somascan
  - ms_proteomics
  - qpcr
  - snp_genotyping
  - lc_ms_metabolomics
  - gc_ms_metabolomics
  - nmr_metabolomics
  - flow_cytometry
  - mass_cytometry
  - other
- name: assay_group
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: true
  permissible_values:
  - proteomics
  - transcriptomics
  - genomics
  - metabolomics
  - cytometry
  - targeted_immunoassay
  - other
- name: analyte_name
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: analyte_id
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: analyte_id_type
  data_type: VARCHAR
  required: false
  is_category_column: true
  is_group_column: false
  permissible_values:
  - uniprot
  - hgnc
  - ensembl_gene
  - ensembl_transcript
  - chebi
  - hmdb
  - kegg
  - ncbi_taxonomy
  - dbsnp
  - loinc
  - other
- name: result_value
  data_type: VARCHAR
  required: true
  is_category_column: false
  is_group_column: false
- name: result_value_numeric
  data_type: DOUBLE
  required: false
  is_category_column: false
  is_group_column: false
- name: result_unit
  data_type: VARCHAR
  required: false
  is_category_column: false
  is_group_column: false
- name: qc_category
  data_type: VARCHAR
  required: true
  is_category_column: true
  is_group_column: false
  permissible_values:
  - pass
  - fail
  - flagged
  - na

required_columns:
  - patient_id
  - specimen_id
  - collect_dttm
  - specimen_category
  - study_name
  - irb_protocol_id
  - consent_category
  - assay_id
  - assay_category
  - assay_group
  - analyte_name
  - result_value
  - qc_category

category_columns:
  - specimen_category
  - consent_category
  - assay_category
  - analyte_id_type
  - qc_category

group_columns:
  - assay_group

assay_category_to_group_mapping:
  elisa: targeted_immunoassay
  luminex: targeted_immunoassay
  olink: proteomics
  somascan: proteomics
  ms_proteomics: proteomics
  qpcr: transcriptomics
  snp_genotyping: genomics
  lc_ms_metabolomics: metabolomics
  gc_ms_metabolomics: metabolomics
  nmr_metabolomics: metabolomics
  flow_cytometry: cytometry
  mass_cytometry: cytometry
  other: other
